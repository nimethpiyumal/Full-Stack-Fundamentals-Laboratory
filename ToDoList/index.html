<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary px-4 py-2 shadow-sm">
        <span class="navbar-brand mb-0 h1 fw-bold fs-5">My To-Do List</span>
    </nav>

    <!-- Main Container -->
    <div class="container d-flex justify-content-center align-items-center my-4 my-md-5">
        <div class="card todo-card shadow-sm border-0 p-4 w-100" style="max-width: 600px;">
            
            <!-- Heading -->
            <div class="text-center mb-4">
                <h1 class="h2 fw-bold text-dark mb-1">Task Manager</h1>
                <p class="text-muted fs-6 mb-0">Organize your tasks and stay productive.</p>
            </div>

            <!-- Input Form -->
            <div class="row g-2 mb-3">
                <div class="col">
                    <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task..." aria-label="New Task">
                </div>
                <div class="col-auto">
                    <button id="addTaskBtn" class="btn btn-primary fw-medium px-3">Add Task</button>
                </div>
            </div>

            <!-- Validation / Error Message -->
            <div id="errorMessage" class="alert alert-danger py-2 d-none mb-3" role="alert">
                Please enter a valid task!
            </div>

            <!-- Header Row: Subtitle & Counter -->
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-semibold text-secondary">Your tasks</span>
                <span id="taskCounter" class="badge bg-primary rounded-pill px-2 py-1 fs-7">0 remaining</span>
            </div>

            <!-- Filter Buttons -->
            <div class="btn-group w-100 mb-3" role="group" aria-label="Task Filters">
                <button type="button" class="btn btn-outline-primary active filter-btn" data-filter="all">All</button>
                <button type="button" class="btn btn-outline-primary filter-btn" data-filter="active">Active</button>
                <button type="button" class="btn btn-outline-primary filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- Task List Container -->
            <ul id="taskList" class="list-group mb-3">
                <!-- Dynamically Populated by JavaScript -->
            </ul>

            <!-- Empty State Message -->
            <div id="emptyMessage" class="text-center text-muted my-3">
                No tasks yet. Add your first task!
            </div>

            <!-- Clear Completed Button -->
            <div class="d-flex justify-content-end mt-2">
                <button id="clearCompletedBtn" class="btn btn-outline-danger btn-sm px-3">Clear Completed</button>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
